<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b5bd6">
  <title>Neuer Counter</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../index.html" aria-label="Zurück">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    </a>
    <h1>Neuer Counter</h1>
  </header>

  <main>
    <form id="form" class="form">
      <label class="field">
        <span>Name</span>
        <input id="name" type="text" maxlength="40" placeholder="z. B. Gläser Wasser" required autofocus>
      </label>

      <fieldset class="field">
        <legend>Farbe</legend>
        <div id="colors" class="colors"></div>
      </fieldset>

      <button type="submit" class="submit">Anlegen</button>
    </form>
  </main>

  <script src="../shared/store.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
