<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b5bd6">
  <title>Counter</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../home/index.html" aria-label="Zurück">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    </a>
    <h1 id="title">Counter</h1>
  </header>

  <main>
    <button id="tap" class="tap">
      <span id="total" class="tap-total">0</span>
      <span class="tap-hint">tippen zum Zählen</span>
    </button>

    <div class="stats">
      <div class="stat"><span id="today">0</span><small>heute</small></div>
      <div class="stat"><span id="days">0</span><small>Tage aktiv</small></div>
      <button id="minus" class="minus i-minus" aria-label="Letzten Klick entfernen"></button>
    </div>

    <h2>Verlauf</h2>
    <ul id="history" class="history"></ul>
    <p id="no-history" class="muted">Noch keine Einträge.</p>

    <button id="delete" class="delete">Counter löschen</button>
  </main>

  <script src="../shared/store.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
